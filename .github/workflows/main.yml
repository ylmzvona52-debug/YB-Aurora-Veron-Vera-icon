
name: Veron Vera Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: YB Aurora Android APK Derle
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodlarini indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android lisanslarini kabul et
        run: yes | sdkmanager --licenses || true

      - name: Kaynak ZIP dosyasini bul ve ac
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
            if [ -f extracted/settings.gradle.kts ]; then
              cp -a extracted/. .
            else
              PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
              if [ -z "$PROJECT_DIR" ]; then
                echo "HATA: ZIP icinde Android Gradle projesi bulunamadi."
                exit 1
              fi
              cp -a "$PROJECT_DIR"/. .
            fi
          fi

          if [ ! -f settings.gradle.kts ] || [ ! -f app/build.gradle.kts ]; then
            echo "HATA: settings.gradle.kts veya app/build.gradle.kts bulunamadi."
            echo "Android proje dosyalari ZIP icinde olmali."
            exit 1
          fi

      - name: Android APK derle
        run: |
          gradle --no-daemon assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Veron-Vera-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
