
name: YB Aurora Veron Vera Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build YB Aurora APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and Locate Project
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          ARCHIVE=$(find . -maxdepth 3 -type f \
            -iname "YB_Aurora_VerON_VERA_Sifirdan_Tek_Proje.zip" \
            -print -quit)

          if [ -n "$ARCHIVE" ]; then
            echo "ZIP found: $ARCHIVE"
            unzip -oq "$ARCHIVE" -d "$GITHUB_WORKSPACE"
          fi

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "settings.gradle.kts" \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project not found!"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app module not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT FOUND: $PROJECT_DIR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Checking Android SDK packages..."

          if [ ! -d "$SDK_ROOT/platforms/android-35" ]; then
            echo "ERROR: Android SDK Platform 35 missing!"
            exit 1
          fi

          if [ ! -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            echo "ERROR: Android Build Tools 35.0.0 missing!"
            exit 1
          fi

          echo "Android SDK components verified."

      - name: Verify Build Environment
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload YB Aurora APK
        uses: actions/upload-artifact@v4
        with:
          name: YB-Aurora-Veron-Vera-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
